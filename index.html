<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://5gvci.com/act/files/tag.min.js?z=11257754" data-cfasync="false" async></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action=manipulation">
    <link rel="manifest" href="pwa/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
<title>⚔️ Dojo Gate · Emoji Ninja</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0b1426;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Kiwi Maru', serif;
            overflow: hidden;
            touch-action: none;
        }
#installBtn {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;

    padding: 12px 24px;
    background: #f5c542;
    color: #222;
    border: none;
    border-radius: 50px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#installBtn[hidden] {
    display: none;
}
        .gate-wrapper {
            position: relative;
            width: 1000px;
            max-width: 98vw;
            height: 650px;
            max-height: 98vh;
            background: #1a1a2e;
            border-radius: 48px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px #f5c54240, 0 0 0 6px #1a2f3f;
            overflow: hidden;
        }

        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 30px 20px;
            pointer-events: none;
        }

        .ui-overlay>* {
            pointer-events: auto;
        }

        .title-section {
            text-align: center;
            margin-top: 10px;
            position: relative;
        }

        .title-main {
            font-size: 4.8rem;
            font-weight: 900;
            color: #f5e6c4;
            text-shadow: 0 0 30px #f5c54280, 0 4px 0 #a57a2a;
            letter-spacing: 10px;
            display: inline-block;
            position: relative;
        }

        .title-main .emoji-sword {
            display: inline-block;
            transform: rotate(-15deg);
            margin-right: 12px;
        }

        .katana-slash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            width: 130%;
            height: 8px;
            background: linear-gradient(90deg, transparent, #ffffff, #f5c542, #ffffff, transparent);
            border-radius: 10px;
            filter: drop-shadow(0 0 30px #f5c542) drop-shadow(0 0 80px #f5c542);
            opacity: 0.7;
            animation: slashPulse 3s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes slashPulse {
            0%,
            100% {
                opacity: 0.4;
                transform: translate(-50%, -50%) rotate(-25deg) scaleX(0.85);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(-25deg) scaleX(1.15);
            }
        }

        .title-sub {
            font-size: 1.2rem;
            color: #b6d6e0;
            letter-spacing: 14px;
            margin-top: -10px;
            opacity: 0.9;
            text-shadow: 0 0 20px #1a2f3f;
        }

        .scroll-panel {
            background: linear-gradient(145deg, #fdf8ed, #f5ebd2);
            padding: 30px 50px 40px;
            border-radius: 60px 60px 40px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 2px 8px rgba(255, 255, 200, 0.6);
            border-bottom: 8px solid #c9a87c;
            text-align: center;
            min-width: 320px;
            position: relative;
            transition: transform 0.3s ease;
        }

        .scroll-panel::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 20px;
            right: 20px;
            height: 4px;
            background: repeating-linear-gradient(90deg, #d4b48c 0px, #d4b48c 8px, transparent 8px, transparent 16px);
            opacity: 0.3;
        }

        .greeting {
            font-size: 1.2rem;
            color: #4a3b2b;
            letter-spacing: 6px;
            margin-bottom: 6px;
            font-weight: 400;
        }

        .dojo-name {
            font-size: 2rem;
            font-weight: 900;
            color: #2d1e15;
            margin-bottom: 14px;
        }

        .dojo-name span {
            color: #c0392b;
        }

        .cta-link {
            display: inline-block;
            background: linear-gradient(145deg, #f5c542, #d49a2a);
            border: none;
            border-bottom: 6px solid #8a651e;
            padding: 16px 44px;
            border-radius: 80px;
            font-size: 2.2rem;
            font-weight: 900;
            color: #1d2c36;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(245, 197, 66, 0.3), inset 0 2px 0 #ffe18a;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 16px;
            letter-spacing: 3px;
            text-decoration: none;
            font-family: 'Segoe UI', sans-serif;
            animation: glowPulse 2s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%,
            100% {
                box-shadow: 0 0 20px #f5c54280, 0 10px 30px rgba(245, 197, 66, 0.3);
            }
            50% {
                box-shadow: 0 0 60px #f5c542, 0 10px 40px rgba(245, 197, 66, 0.5);
            }
        }

        .cta-link:hover {
            transform: scale(1.03);
            background: linear-gradient(145deg, #ffd966, #e6b03a);
            border-bottom-color: #a57a2a;
        }

        .cta-link:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .cta-link .ninja-icon {
            font-size: 2.6rem;
            line-height: 1;
        }

        .footer-placeholder {
            height: 10px;
        }

        @media (max-width: 700px) {
            .gate-wrapper {
                border-radius: 24px;
                max-height: 100vh;
                max-width: 100vw;
                height: 100vh;
                width: 100vw;
            }
            .title-main {
                font-size: 3rem;
                letter-spacing: 6px;
            }
            .title-sub {
                font-size: 0.8rem;
                letter-spacing: 8px;
            }
            .scroll-panel {
                padding: 20px 24px 30px;
                min-width: unset;
                width: 90%;
            }
            .dojo-name {
                font-size: 1.5rem;
            }
            .cta-link {
                font-size: 1.6rem;
                padding: 14px 28px;
                gap: 12px;
            }
            .cta-link .ninja-icon {
                font-size: 2rem;
            }
        }

        @media (max-width: 400px) {
            .title-main {
                font-size: 2.2rem;
            }
            .cta-link {
                font-size: 1.3rem;
                padding: 12px 20px;
            }
            .scroll-panel {
                padding: 16px 16px 24px;
            }
            .greeting {
                font-size: 1rem;
            }
            .dojo-name {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="gate-wrapper" id="gateWrapper">
        <canvas id="bgCanvas"></canvas>

        <div class="ui-overlay">
            <div class="title-section">
                <div class="title-main">
                    <span class="emoji-sword">⚔️</span> Emoji Ninja
                    <div class="katana-slash"></div>
                </div>
                <div class="title-sub">— The Dojo Gate —</div>
            </div>

            <div class="scroll-panel">
                <div class="greeting">◈ Welcome, Warrior ◈</div>
                <div class="dojo-name">〈 <span>Shadow</span> Dojo 〉</div>
                <!-- Link updated to 'amn.html' -->
                <a href="levels.html" class="cta-link" id="slashLink">
                    <span class="ninja-icon">🗡️</span> Slash In
                </a>
            </div>

            <div class="footer-placeholder"></div>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('gateWrapper');

            function resizeCanvas() {
                const rect = wrapper.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const W = () => canvas.width;
            const H = () => canvas.height;

            // ---- Cherry Blossom Petals ----
            class Petal {
                constructor() {
                    this.reset();
                    this.y = Math.random() * H();
                }
                reset() {
                    this.x = Math.random() * W();
                    this.y = -30 - Math.random() * 120;
                    this.size = 8 + Math.random() * 18;
                    this.speed = 0.8 + Math.random() * 2.2;
                    this.drift = (Math.random() - 0.5) * 1.5;
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotSpeed = (Math.random() - 0.5) * 0.04;
                    this.opacity = 0.4 + Math.random() * 0.5;
                    const colors = ['#ffb6c1', '#ffc0cb', '#ffd1dc', '#f5c542', '#ffa07a'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }
                update() {
                    this.y += this.speed;
                    this.x += Math.sin(this.y * 0.02) * 0.8 + this.drift * 0.4;
                    this.rotation += this.rotSpeed;
                    if (this.y > H() + 30) {
                        this.reset();
                        this.y = -30;
                    }
                    if (this.x < -40) this.x = W() + 30;
                    if (this.x > W() + 40) this.x = -30;
                }
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = 'rgba(255,180,200,0.3)';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 0.6, this.size * 0.35, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.beginPath();
                    ctx.ellipse(-2, -4, this.size * 0.2, this.size * 0.08, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            const petalCount = 70;
            const petals = [];
            for (let i = 0; i < petalCount; i++) {
                petals.push(new Petal());
            }

            // ---- Fireflies ----
            class Firefly {
                constructor() {
                    this.x = Math.random() * W();
                    this.y = Math.random() * H() * 0.7;
                    this.radius = 2 + Math.random() * 4;
                    this.speed = 0.2 + Math.random() * 0.4;
                    this.angle = Math.random() * Math.PI * 2;
                    this.phase = Math.random() * 100;
                    this.color = `hsl(${40 + Math.random() * 20}, 80%, 70%)`;
                }
                update() {
                    this.angle += 0.02;
                    this.x += Math.cos(this.angle) * this.speed * 0.5;
                    this.y += Math.sin(this.angle * 0.7) * this.speed * 0.3;
                    this.phase += 0.03;
                    if (this.x < 0) this.x = W();
                    if (this.x > W()) this.x = 0;
                    if (this.y < 0) this.y = H() * 0.7;
                    if (this.y > H() * 0.7) this.y = 0;
                }
                draw() {
                    const glow = 0.5 + 0.5 * Math.sin(this.phase);
                    ctx.save();
                    ctx.globalAlpha = 0.3 + glow * 0.4;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * (0.8 + glow * 0.4), 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            const fireflies = [];
            for (let i = 0; i < 30; i++) {
                fireflies.push(new Firefly());
            }

            // ---- Background ----
            function drawBackground() {
                const w = W();
                const h = H();

                // Sky gradient
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#0b1426');
                grad.addColorStop(0.4, '#1a2f3f');
                grad.addColorStop(0.7, '#2d1e36');
                grad.addColorStop(1, '#1a0f1a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // ---- Moon ----
                const moonX = w * 0.85;
                const moonY = h * 0.18;
                const moonR = Math.min(w, h) * 0.13;

                let glow = ctx.createRadialGradient(moonX, moonY, moonR * 0.1, moonX, moonY, moonR * 4);
                glow.addColorStop(0, 'rgba(255, 235, 200, 0.5)');
                glow.addColorStop(0.5, 'rgba(255, 235, 200, 0.15)');
                glow.addColorStop(1, 'rgba(255, 235, 200, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(moonX, moonY, moonR * 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowColor = '#f5e6c4';
                ctx.shadowBlur = 60;
                ctx.fillStyle = '#fdf8ed';
                ctx.beginPath();
                ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(200, 180, 160, 0.15)';
                ctx.beginPath();
                ctx.arc(moonX - moonR * 0.3, moonY - moonR * 0.2, moonR * 0.25, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(moonX + moonR * 0.35, moonY + moonR * 0.3, moonR * 0.18, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(moonX + moonR * 0.1, moonY - moonR * 0.45, moonR * 0.12, 0, Math.PI * 2);
                ctx.fill();

                // ---- Dojo Silhouette ----
                ctx.shadowBlur = 0;

                const groundY = h * 0.78;

                // Ground — solid black
                ctx.fillStyle = '#050308';
                ctx.fillRect(0, groundY, w, h - groundY);

                // Gate structure
                const gateX = w * 0.5;
                const gateW = w * 0.38;
                const gateH = h * 0.42;
                const gateY = groundY - gateH;

                ctx.fillStyle = '#0f0c16';
                ctx.fillRect(gateX - gateW / 2, gateY, gateW, gateH);

                ctx.fillStyle = '#0a0812';
                ctx.beginPath();
                ctx.moveTo(gateX - gateW / 2 - 30, gateY);
                ctx.quadraticCurveTo(gateX - gateW / 2, gateY - gateH * 0.28, gateX, gateY - gateH * 0.35);
                ctx.quadraticCurveTo(gateX + gateW / 2, gateY - gateH * 0.28, gateX + gateW / 2 + 30, gateY);
                ctx.fill();

                ctx.fillStyle = '#0a0812';
                ctx.beginPath();
                ctx.moveTo(gateX - gateW / 4, gateY - gateH * 0.18);
                ctx.lineTo(gateX, gateY - gateH * 0.35);
                ctx.lineTo(gateX + gateW / 4, gateY - gateH * 0.18);
                ctx.fill();

                ctx.fillStyle = '#050308';
                ctx.fillRect(gateX - gateW / 4, gateY + gateH * 0.2, gateW / 2, gateH * 0.8);

                ctx.fillStyle = '#0f0c16';
                ctx.fillRect(gateX - gateW / 2, gateY, 14, gateH);
                ctx.fillRect(gateX + gateW / 2 - 14, gateY, 14, gateH);

                // Lanterns
                ctx.shadowColor = '#f5c542';
                ctx.shadowBlur = 25;
                ctx.fillStyle = '#e94560';
                ctx.beginPath();
                ctx.arc(gateX - gateW / 3, gateY + 12, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(gateX + gateW / 3, gateY + 12, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // ---- Animation ----
            function animate() {
                const w = W(),
                    h = H();
                ctx.clearRect(0, 0, w, h);

                drawBackground();

                for (const p of petals) {
                    p.update();
                    p.draw();
                }

                for (const f of fireflies) {
                    f.update();
                    f.draw();
                }

                requestAnimationFrame(animate);
            }

            animate();

            window.addEventListener('resize', () => {
                resizeCanvas();
            });

        })();
    </script>
    <button id="installBtn" hidden>Install App</button>
    <script src="pwa/index.js"></script>
</body>
</html>
