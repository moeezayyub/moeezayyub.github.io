<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0a1a" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Emoji Sort — choose a world to play." />
<title>Emoji Worlds — Emoji Sort</title>
<style>
  :root{
    --ease: cubic-bezier(.22,.9,.28,1);
    --ink: #f3f0ff;
    --emoji: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",
             "Twemoji Mozilla","EmojiOne Color","Segoe UI Symbol",sans-serif;
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html{
    height:100%;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }

  body{
    margin:0;
    min-height:100%;
    overflow-x:hidden;
    overscroll-behavior-y:none;
    background:#0b0a1a;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,
                var(--emoji);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
    touch-action:manipulation;
  }

  /* ---------------- Background ---------------- */

  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(95% 55% at 50% 34%,
        rgba(96,64,190,.40) 0%,
        rgba(59,42,107,.18) 46%,
        rgba(11,10,26,0) 74%),
      linear-gradient(168deg,#0b0a1a 0%, #1a1333 44%, #150f2b 74%, #0b0a1a 100%);
    animation: bgIn .5s ease-out both;
  }

  .glow{
    position:fixed;
    left:50%;
    top:38%;
    width:min(150vw, 940px);
    aspect-ratio:1 / 1;
    transform:translate(-50%,-50%);
    z-index:0;
    pointer-events:none;
    background:radial-gradient(circle,
      rgba(124,92,255,.26) 0%,
      rgba(124,92,255,.09) 40%,
      rgba(124,92,255,0) 68%);
    animation: glowIn .7s ease-out both, breathe 11s ease-in-out 1s infinite;
  }

  @keyframes bgIn{ from{ opacity:0 } to{ opacity:1 } }
  @keyframes glowIn{ from{ opacity:0 } to{ opacity:1 } }
  @keyframes breathe{
    0%,100%{ opacity:.7;  transform:translate(-50%,-50%) scale(1); }
    50%    { opacity:1;   transform:translate(-50%,-50%) scale(1.05); }
  }

  /* ---------------- Floating emojis ---------------- */

  .floaters{
    position:fixed;
    inset:0;
    z-index:1;
    overflow:hidden;
    pointer-events:none;
    contain:strict;
  }

  .floater{
    position:absolute;
    display:block;
    line-height:1;
    font-family:var(--emoji);
    opacity:var(--op,.16);
    will-change:transform;
    transform:translate3d(0,0,0) rotate(var(--rot,0deg));
    animation: float var(--dur,24s) ease-in-out var(--delay,0s) infinite alternate;
  }

  @keyframes float{
    from{ transform: translate3d(0,0,0) rotate(var(--rot,0deg)); }
    to  { transform: translate3d(var(--dx,0px), var(--dy,0px), 0)
                     rotate(calc(var(--rot,0deg) + 12deg)); }
  }

  /* ---------------- Page shell ---------------- */

  .page{
    position:relative;
    z-index:2;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding:
      calc(10px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(16px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
  }

  /* ---------------- Top bar ---------------- */

  .topbar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    min-height:44px;
  }

  .back{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:10px 16px 10px 12px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.14);
    background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
    color:var(--ink);
    font:inherit;
    font-size:15px;
    font-weight:600;
    letter-spacing:.01em;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.12);
    transition: transform .12s var(--ease), background .2s ease;
  }
  .back:active{ transform:scale(.94); }
  .back svg{ display:block; }

  /* ---------------- Heading ---------------- */

  .head{
    flex:0 0 auto;
    text-align:center;
    padding:14px 0 18px;
  }

  .head h1{
    margin:0;
    font-size:clamp(22px, 6.6vw, 28px);
    font-weight:800;
    letter-spacing:.05em;
    background:linear-gradient(180deg,#ffffff 0%, #cfc2ff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 26px rgba(124,92,255,.32);
  }

  .head p{
    margin:8px 0 0;
    font-size:14px;
    font-weight:500;
    color:rgba(232,226,255,.60);
  }

  /* ---------------- Carousel ---------------- */

  .carousel{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:0;
  }

  .deck{
    width:100%;
    max-width:400px;
    margin:0 auto;
    overflow:hidden;
    border-radius:28px;
    touch-action:pan-y;
    contain:layout paint;
  }

  .track{
    display:flex;
    width:100%;
    transition: transform .42s var(--ease);
    will-change:transform;
  }

  .card{
    flex:0 0 100%;
    width:100%;
    padding:6px 10px 16px;
  }

  /* ---------------- Card ---------------- */

  .card-inner{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    padding:30px 20px 24px;
    border-radius:26px;
    border:1px solid rgba(255,255,255,.13);
    background:linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,.028));
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    backdrop-filter:blur(16px) saturate(140%);
    box-shadow:
      0 18px 40px rgba(0,0,0,.36),
      inset 0 1px 0 rgba(255,255,255,.12);
    overflow:hidden;
  }

  .card-inner::before{
    content:'';
    position:absolute;
    left:50%;
    top:-78px;
    width:250px;
    height:190px;
    transform:translateX(-50%);
    background:radial-gradient(closest-side, var(--accent), transparent 100%);
    opacity:.38;
    filter:blur(20px);
    pointer-events:none;
  }

  .world-badge{
    position:relative;
    width:96px;
    height:96px;
    border-radius:30px;
    display:grid;
    place-items:center;
    font-family:var(--emoji);
    font-size:52px;
    line-height:1;
    padding-bottom:2px;
    background:radial-gradient(circle at 50% 28%, rgba(255,255,255,.17), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.15);
    box-shadow:
      0 0 36px -8px var(--accent),
      inset 0 1px 0 rgba(255,255,255,.22);
  }

  .world-name{
    position:relative;
    margin:0;
    font-size:21px;
    font-weight:750;
    letter-spacing:.035em;
    color:#fff;
  }

  .preview{
    position:relative;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
  }

  .preview span{
    width:50px;
    height:50px;
    border-radius:16px;
    display:grid;
    place-items:center;
    font-family:var(--emoji);
    font-size:26px;
    line-height:1;
    padding-bottom:2px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    overflow:visible;
    white-space:nowrap;
  }

  /* ---------------- Play button ---------------- */

  .play-btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:56px;
    margin-top:2px;
    padding:15px 20px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.24);
    background:linear-gradient(180deg, var(--accent) 0%, var(--accent2) 100%);
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:800;
    letter-spacing:.16em;
    text-indent:.16em;
    text-decoration:none;
    cursor:pointer;
    box-shadow:
      0 12px 28px -8px var(--accent),
      0 2px 8px rgba(0,0,0,.32),
      inset 0 1px 0 rgba(255,255,255,.30);
    transition: transform .12s var(--ease), filter .2s ease, opacity .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .play-btn:active{ transform:scale(.965); }

  @media (hover:hover) and (pointer:fine){
    .play-btn:hover{ filter:brightness(1.07); }
  }

  /* Waiting for the click sound to finish before navigating */
  .play-btn.is-waiting{
    opacity:.86;
    filter:brightness(.94) saturate(.92);
  }

  .back:focus-visible,
  .play-btn:focus-visible,
  .nav-arrow:focus-visible,
  .dot:focus-visible{
    outline:2px solid rgba(170,142,255,.95);
    outline-offset:3px;
  }

  /* ---------------- Bottom controls ---------------- */

  .controls{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding-top:18px;
  }

  .nav-arrow{
    width:48px;
    height:48px;
    flex:0 0 auto;
    border-radius:50%;
    display:grid;
    place-items:center;
    border:1px solid rgba(255,255,255,.15);
    background:linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.04));
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
    color:var(--ink);
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12);
    transition: transform .12s var(--ease),
                background .2s ease,
                opacity .2s ease;
  }
  .nav-arrow svg{ display:block; }
  .nav-arrow:active{ transform:scale(.9); }
  .nav-arrow[disabled]{ opacity:.28; pointer-events:none; }

  @media (hover:hover) and (pointer:fine){
    .nav-arrow:hover{ background:rgba(255,255,255,.14); }
  }

  .dots{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    min-height:20px;
    flex-wrap:wrap;
    max-width:190px;
  }

  .dot{
    width:7px;
    height:7px;
    padding:0;
    border:0;
    border-radius:99px;
    background:rgba(255,255,255,.24);
    cursor:pointer;
    transition: width .3s var(--ease), background .3s ease;
  }
  .dot.active{
    width:20px;
    background:linear-gradient(90deg,#a48cff,#7c5cff);
  }

  /* ---------------- Entrance animation ---------------- */

  .rise{
    animation: rise .36s var(--ease) backwards;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(16px) scale(.985); }
    to  { opacity:1; transform: none; }
  }

  .topbar.rise   { animation-delay:.00s; }
  .head.rise     { animation-delay:.04s; }
  .carousel.rise { animation-delay:.10s; }
  .controls.rise { animation-delay:.17s; }

  /* ---------------- Accessibility ---------------- */

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-delay:0ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }

  /* ---------------- Small screens ---------------- */

  @media (max-height:640px){
    .head{ padding:6px 0 10px; }
    .head p{ display:none; }
    .card-inner{ gap:14px; padding:22px 18px 20px; }
    .world-badge{ width:78px; height:78px; font-size:42px; border-radius:24px; }
    .preview span{ width:42px; height:42px; font-size:22px; border-radius:13px; }
  }
</style>
</head>
<body>

  <div class="bg" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <div class="floaters" id="floaters" aria-hidden="true"></div>

  <div class="page">

    <header class="topbar rise">
      <a class="back" id="backBtn" href="index.html">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 5l-7 7 7 7"/>
        </svg>
        Back
      </a>
    </header>

    <div class="head rise">
      <h1>🎨 Emoji Worlds</h1>
      <p>Choose a world to play</p>
    </div>

    <div class="carousel rise">
      <div class="deck" id="deck">
        <div class="track" id="track"></div>
      </div>
    </div>

    <div class="controls rise">
      <button class="nav-arrow" id="prevWorld" type="button" aria-label="Previous world">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 5l-7 7 7 7"/>
        </svg>
      </button>

      <div class="dots" id="dots" role="tablist" aria-label="Worlds"></div>

      <button class="nav-arrow" id="nextWorld" type="button" aria-label="Next world">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>

  </div>

<script>
(function () {
  'use strict';

  /* =========================================================
     0. BUTTON CLICK SOUND
     =========================================================
     playSound()
       → fire-and-forget click for IN-PAGE actions
         (prev / next / dots). Starts the clip and returns
         immediately; the page never unloads, so the sound
         always plays out on its own.

     playButtonSound(onDone)
       → plays the click and calls onDone when the audio has
         actually FINISHED (or when audio is unavailable).

     clickThenLeave(action)
       → for the PLAY and BACK buttons. Waits for the sound
         to finish before navigating, so the last part of the
         sound is no longer cut off.
     ========================================================= */

  var buttonSound = new Audio('sounds/buttonclick.mp3');
  buttonSound.preload = 'auto';
  buttonSound.volume  = 0.65;
  try { buttonSound.load(); } catch (e) {}

  var SOUND_TAIL     = 90;    // pause after the sound ends (ms)
  var SOUND_FALLBACK = 1200;  // used if duration isn't known yet

  /**
   * How long we are willing to wait for the sound to finish.
   * Uses the real clip duration when the browser knows it,
   * otherwise falls back to a safe constant.
   */
  function soundGuardMs() {
    var d = buttonSound.duration;
    if (isFinite(d) && d > 0) {
      return Math.min(d * 1000 + 400, 3000);
    }
    return SOUND_FALLBACK;
  }

  /**
   * Fire-and-forget click sound for IN-PAGE actions
   * (prev / next / dots). Rewinds so rapid taps replay,
   * then returns immediately.
   */
  function playSound() {
    try {
      buttonSound.pause();
      buttonSound.currentTime = 0;   // rewind so rapid taps replay
    } catch (e) { /* not supported — ignore */ }

    try {
      var p = buttonSound.play();
      if (p && typeof p.catch === 'function') {
        p.catch(function () { /* autoplay blocked — ignore */ });
      }
    } catch (e) { /* ignore */ }
  }

  /**
   * Play the click sound, then call `onDone` once it has ended.
   * Always calls `onDone` exactly once — even if the audio is
   * blocked, missing, or never fires 'ended'.
   * Used ONLY by PLAY and BACK, which unload the page.
   */
  function playButtonSound(onDone) {
    var settled = false;
    var guardTimer = null;

    function settle() {
      if (settled) return;
      settled = true;
      if (guardTimer) window.clearTimeout(guardTimer);
      if (typeof onDone === 'function') onDone();
    }

    // Safety net: never hold the UI hostage to a stuck audio element.
    guardTimer = window.setTimeout(settle, soundGuardMs());

    var onEnded = function () {
      buttonSound.removeEventListener('ended', onEnded);
      // Tiny tail so the very last sample isn't clipped.
      window.setTimeout(settle, SOUND_TAIL);
    };
    buttonSound.addEventListener('ended', onEnded);

    try {
      buttonSound.pause();
      buttonSound.currentTime = 0;   // rewind so rapid taps replay
    } catch (e) { /* not supported — ignore */ }

    try {
      var p = buttonSound.play();
      if (p && typeof p.catch === 'function') {
        p.catch(function () {
          // Autoplay blocked or file missing → don't block navigation.
          buttonSound.removeEventListener('ended', onEnded);
          settle();
        });
      }
    } catch (e) {
      buttonSound.removeEventListener('ended', onEnded);
      settle();
    }
  }

  /**
   * Navigating action (PLAY / BACK): wait for the click sound to
   * finish completely, then run `action`.
   */
  function clickThenLeave(action) {
    playButtonSound(action);
  }

  /* =========================================================
     1. World data — each world maps to its own HTML file
     ========================================================= */

  var WORLDS = [
    { id:'faces',     name:'Faces',     icon:'😀', emojis:['😊','😎','🥳','🤖'], file:'faces.html',     accent:'#7c5cff', accent2:'#5a37d6' },
    { id:'animals',   name:'Animals',   icon:'🐶', emojis:['🐱','🐶','🦁','🐼'], file:'animals.html',   accent:'#ff8a4c', accent2:'#d9531f' },
    { id:'food',      name:'Food',      icon:'🍔', emojis:['🍕','🍩','🍟','🍦'], file:'food.html',      accent:'#ff5f8f', accent2:'#c92a5f' },
    { id:'sports',    name:'Sports',    icon:'⚽', emojis:['⚽','🏀','🎾','🏈'], file:'sports.html',    accent:'#34c6a0', accent2:'#128a6c' },
    { id:'tools',     name:'Tools',     icon:'🛠️', emojis:['🔨','🔧','🔩','⚙️'], file:'tools.html',     accent:'#93a3bd', accent2:'#5b6a85' },
    { id:'vehicles',  name:'Vehicles',  icon:'🚗', emojis:['🚗','🚕','🚙','🚓'], file:'vehicles.html',  accent:'#4aa8ff', accent2:'#1a68c9' },
    { id:'nature',    name:'Nature',    icon:'🌍', emojis:['🌳','🌸','🌵','🍄'], file:'nature.html',    accent:'#5ecb5e', accent2:'#2b8f3a' },
    { id:'halloween', name:'Halloween', icon:'🎃', emojis:['🎃','👻','💀','🦇'], file:'halloween.html', accent:'#ff9130', accent2:'#c9431a' },
    { id:'christmas', name:'Christmas', icon:'🎄', emojis:['🎄','🎁','⭐','⛄'], file:'christmas.html', accent:'#ef4a5a', accent2:'#a81628' }
  ];

  /* =========================================================
     2. Floating background emojis (transform-only, 8 nodes)
     ========================================================= */

  var FLOAT_EMOJIS = ['😀','😎','🥳','🤖','🐱','🍔','⚽','🎃','⭐','🍩'];
  var floatLayer = document.getElementById('floaters');
  var frag = document.createDocumentFragment();

  for (var f = 0; f < 8; f++) {
    var fl = document.createElement('span');
    fl.className = 'floater';
    fl.textContent = FLOAT_EMOJIS[f % FLOAT_EMOJIS.length];

    fl.style.left     = (2 + Math.random() * 90).toFixed(2) + '%';
    fl.style.top      = (3 + Math.random() * 88).toFixed(2) + '%';
    fl.style.fontSize = (20 + Math.random() * 30).toFixed(0) + 'px';

    fl.style.setProperty('--op',    (0.11 + Math.random() * 0.08).toFixed(2));
    fl.style.setProperty('--dx',    Math.round(Math.random() * 46 - 23) + 'px');
    fl.style.setProperty('--dy',    Math.round(Math.random() * 58 - 29) + 'px');
    fl.style.setProperty('--rot',   Math.round(Math.random() * 40 - 20) + 'deg');
    fl.style.setProperty('--dur',   (20 + Math.random() * 16).toFixed(1) + 's');
    fl.style.setProperty('--delay', (-Math.random() * 26).toFixed(1) + 's');

    frag.appendChild(fl);
  }
  floatLayer.appendChild(frag);

  /* =========================================================
     3. Element refs
     ========================================================= */

  var track   = document.getElementById('track');
  var deck    = document.getElementById('deck');
  var dotsBox = document.getElementById('dots');
  var prevBtn = document.getElementById('prevWorld');
  var nextBtn = document.getElementById('nextWorld');
  var backBtn = document.getElementById('backBtn');

  /* =========================================================
     4. Build cards
     ========================================================= */

  track.innerHTML = WORLDS.map(function (w, i) {
    return '' +
      '<div class="card" data-i="' + i + '">' +
        '<div class="card-inner" style="--accent:' + w.accent + ';--accent2:' + w.accent2 + '">' +

          '<div class="world-badge" aria-hidden="true">' + w.icon + '</div>' +

          '<h2 class="world-name">' + w.name + '</h2>' +

          '<div class="preview" aria-hidden="true">' +
            w.emojis.map(function (e) { return '<span>' + e + '</span>'; }).join('') +
          '</div>' +

          '<a class="play-btn" href="' + w.file + '" data-world="' + w.id + '">PLAY</a>' +

        '</div>' +
      '</div>';
  }).join('');

  /* =========================================================
     5. Navigation state
     ========================================================= */

  var wi = 0;
  var last = WORLDS.length - 1;

  var dots = WORLDS.map(function (w, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'dot';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-label', 'Go to ' + w.name);
    b.addEventListener('click', function () {
      // In-page action: sound starts now, slide happens now.
      playSound();
      go(i);
    });
    dotsBox.appendChild(b);
    return b;
  });

  function go(i) {
    i = Math.max(0, Math.min(last, i));
    wi = i;

    track.style.transition = '';
    void track.offsetWidth;                        /* flush pending style */
    track.style.transform = 'translate3d(' + (-i * 100) + '%,0,0)';

    prevBtn.disabled = (i === 0);
    nextBtn.disabled = (i === last);

    for (var k = 0; k < dots.length; k++) {
      var on = (k === i);
      dots[k].classList.toggle('active', on);
      dots[k].setAttribute('aria-selected', on ? 'true' : 'false');
    }
  }

  /* =========================================================
     6. Buttons (single source of truth — no duplicate listeners)
     ========================================================= */

  var leaving = false;   // guards against double navigation

  // Back — waits for the click sound to finish, then leaves.
  backBtn.addEventListener('click', function (e) {
    e.preventDefault();
    if (leaving) return;
    leaving = true;

    var href = backBtn.getAttribute('href') || 'index.html';

    clickThenLeave(function () {
      window.location.href = href;
    });
  });

  // Previous world — in-page, sound starts and slide happens now.
  prevBtn.addEventListener('click', function () {
    if (prevBtn.disabled) return;
    playSound();
    go(wi - 1);
  });

  // Next world — in-page, sound starts and slide happens now.
  nextBtn.addEventListener('click', function () {
    if (nextBtn.disabled) return;
    playSound();
    go(wi + 1);
  });

  // Play buttons (delegated) — waits for the sound to finish
  // before loading the game, so the click sound isn't clipped.
  track.addEventListener('click', function (e) {
    var link = e.target.closest ? e.target.closest('a.play-btn') : null;
    if (!link) return;

    e.preventDefault();
    if (leaving) return;
    leaving = true;

    link.classList.add('is-waiting');
    link.setAttribute('aria-busy', 'true');

    var worldId = link.getAttribute('data-world');
    var href    = link.getAttribute('href');

    clickThenLeave(function () {
      if (typeof window.startEmojiSort === 'function') {
        window.startEmojiSort({ world: worldId });
      } else {
        window.location.href = href;               // native navigation
      }
    });
  });

  /* =========================================================
     7. Swipe / drag on the deck
     ========================================================= */

  var startX = 0, startY = 0, dragging = false, lockedAxis = '';

  deck.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    dragging = true;
    lockedAxis = '';
  }, { passive: true });

  deck.addEventListener('touchmove', function (e) {
    if (!dragging || e.touches.length !== 1) return;

    var dx = e.touches[0].clientX - startX;
    var dy = e.touches[0].clientY - startY;

    if (!lockedAxis) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      lockedAxis = (Math.abs(dx) > Math.abs(dy) * 1.2) ? 'x' : 'y';
    }
    if (lockedAxis !== 'x') return;

    track.style.transition = 'none';
    track.style.transform =
      'translate3d(calc(' + (-wi * 100) + '% + ' + (dx * 0.42).toFixed(1) + 'px),0,0)';
  }, { passive: true });

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;

    if (lockedAxis !== 'x') { go(wi); return; }

    var t  = e.changedTouches[0];
    var dx = t.clientX - startX;
    var dy = t.clientY - startY;

    if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      go(dx < 0 ? wi + 1 : wi - 1);
    } else {
      go(wi);
    }
    lockedAxis = '';
  }

  deck.addEventListener('touchend', endDrag, { passive: true });
  deck.addEventListener('touchcancel', function () {
    dragging = false;
    lockedAxis = '';
    go(wi);
  }, { passive: true });

  /* =========================================================
     8. Keyboard
     ========================================================= */

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft')       { go(wi - 1); }
    else if (e.key === 'ArrowRight') { go(wi + 1); }
  });

  /* =========================================================
     9. Boot
     ========================================================= */

  go(0);

})();
</script>
</body>
</html>
