<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Classic · Path of the Samurai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Kiwi+Maru&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0b0b12;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel', 'Kiwi Maru', serif;
            overflow: hidden;
            touch-action: none;
        }

        #gameWrapper {
            position: relative;
            width: 1000px;
            max-width: 98vw;
            height: 650px;
            max-height: 98vh;
            background: #0b1426;
            border-radius: 48px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px #f5c54240, 0 0 0 6px #1a2f3f;
            overflow: hidden;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 1;
            cursor: none;
            touch-action: none;
            background: #0b1426;
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #hud>* {
            pointer-events: auto;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-lives {
            font-size: 2.4rem;
            line-height: 1;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            letter-spacing: 8px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 18px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hud-score {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 900;
            color: #f5e6c4;
            text-shadow: 0 0 30px #f5c54280, 0 4px 0 #a57a2a;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 24px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            letter-spacing: 2px;
        }

        .hud-miss {
            font-family: 'Kiwi Maru', serif;
            font-size: 1rem;
            color: #ffb6c1;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 16px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 8px;
            display: inline-block;
        }

        .hud-bottom {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding-bottom: 10px;
        }

        .btn-back {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 700;
            color: #faf3e6;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 8px 24px;
            border-radius: 40px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            text-decoration: none;
            letter-spacing: 2px;
            pointer-events: auto;
        }

        .btn-back:hover {
            background: rgba(192, 57, 43, 0.7);
            border-color: #c0392b;
            transform: scale(1.05);
        }

        /* Game Over Overlay */
        #gameOverlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            border-radius: 48px;
            padding: 30px;
        }

        #gameOverlay.active {
            display: flex;
        }

        .overlay-title {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            font-weight: 900;
            color: #e74c3c;
            text-shadow: 0 0 40px rgba(231, 76, 60, 0.6);
            letter-spacing: 6px;
        }

        .overlay-score {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: #f5e6c4;
            letter-spacing: 4px;
        }

        .overlay-buttons {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-overlay {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: #1d2c36;
            border: none;
            padding: 14px 36px;
            border-radius: 80px;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 3px;
            min-width: 160px;
        }

        .btn-overlay:hover {
            transform: scale(1.05);
        }

        .btn-overlay:active {
            transform: translateY(4px);
        }

        .btn-tryagain {
            background: linear-gradient(145deg, #f5c542, #d49a2a);
            border-bottom: 6px solid #8a651e;
        }

        .btn-tryagain:hover {
            background: linear-gradient(145deg, #ffd966, #e6b03a);
        }

        .btn-respawn {
            background: linear-gradient(145deg, #6c5ce7, #4a3db8);
            border-bottom: 6px solid #2d1f7a;
            color: #faf3e6;
        }

        .btn-respawn:hover {
            background: linear-gradient(145deg, #7d6ff0, #5a4dd0);
        }

    /* IFrame Overlay – external site */
#iframeOverlay {
    position: absolute;
    inset: 0;
    z-index: 30;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(12px);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 48px;
    padding: 30px;
}

#iframeOverlay.active {
    display: flex;
}

#iframeOverlay iframe {
    width: 85%;
    max-width: 900px;
    height: 85vh;                     /* taller on desktop */
    max-height: 900px;
    border: 2px solid rgba(245, 197, 66, 0.25);
    border-radius: 24px;
    box-shadow: 0 0 60px rgba(245, 197, 66, 0.10);
    background: #ffffff;
    transition: opacity 0.4s ease;
}

.iframe-close-btn {
    font-family: 'Cinzel', serif;
    font-size: 1.2rem;
    font-weight: 900;
    color: #1d2c36;
    background: linear-gradient(145deg, #f5c542, #d49a2a);
    border: none;
    border-bottom: 6px solid #8a651e;
    padding: 14px 48px;
    border-radius: 80px;
    cursor: pointer;
    transition: all 0.15s ease;
    letter-spacing: 3px;
    margin-top: 24px;
    display: none;
    pointer-events: auto;
}

.iframe-close-btn:hover {
    transform: scale(1.05);
    background: linear-gradient(145deg, #ffd966, #e6b03a);
}

.iframe-close-btn:active {
    transform: translateY(4px);
    border-bottom-width: 2px;
}

.iframe-close-btn.show {
    display: block;
}

/* bigger "sponsored revival" label */
.iframe-label {
    font-family: 'Kiwi Maru', serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.6);
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 16px;
    background: rgba(0, 0, 0, 0.4);
    padding: 8px 28px;
    border-radius: 60px;
    border: 1px solid rgba(255, 215, 100, 0.15);
    text-shadow: 0 0 30px rgba(245, 197, 66, 0.15);
}

/* Responsive */
@media (max-width: 700px) {
    #gameWrapper {
        border-radius: 24px;
        max-height: 100vh;
        max-width: 100vw;
        height: 100vh;
        width: 100vw;
    }
    #gameOverlay {
        border-radius: 24px;
    }
    #iframeOverlay {
        border-radius: 24px;
        padding: 20px 12px;
    }
    #iframeOverlay iframe {
        width: 96%;
        height: 75vh;                  /* ← slightly taller on mobile/tablet */
        max-height: 750px;
    }

    .hud-lives {
        font-size: 1.8rem;
        padding: 4px 12px;
    }
    .hud-score {
        font-size: 1.4rem;
        padding: 4px 16px;
    }
    .overlay-title {
        font-size: 2.8rem;
    }
    .btn-overlay {
        font-size: 1rem;
        padding: 12px 24px;
        min-width: 120px;
    }

    .iframe-label {
        font-size: 1.1rem;
        padding: 6px 20px;
        letter-spacing: 6px;
        margin-bottom: 12px;
    }
    .iframe-close-btn {
        font-size: 1rem;
        padding: 12px 32px;
        margin-top: 18px;
    }
}

@media (max-width: 400px) {
    .hud-lives {
        font-size: 1.4rem;
    }
    .hud-score {
        font-size: 1.2rem;
    }
    .hud-miss {
        font-size: 0.7rem;
    }
    .overlay-title {
        font-size: 2rem;
    }
    .btn-overlay {
        font-size: 0.85rem;
        padding: 10px 18px;
        min-width: 100px;
    }
    #iframeOverlay iframe {
        height: 65vh;                  /* ← slightly taller on tiny screens */
        max-height: 480px;
    }
    .overlay-buttons {
        gap: 12px;
    }
    .iframe-label {
        font-size: 0.95rem;
        padding: 5px 16px;
        letter-spacing: 4px;
    }
    .iframe-close-btn {
        font-size: 0.85rem;
        padding: 10px 24px;
    }
}
    </style>
</head>
<body>

    <div id="gameWrapper">
        <!-- Canvas for game rendering -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD Overlay -->
        <div id="hud">
            <div class="hud-top">
                <div>
                    <div class="hud-lives" id="livesDisplay">❤️❤️❤️</div>
                    <div class="hud-miss" id="missDisplay">Misses: 0 / 2</div>
                </div>
                <div class="hud-score" id="scoreDisplay">🍉 0</div>
            </div>
            <div class="hud-bottom">
                <a href="levels.html" class="btn-back">⬅ Dojo</a>
            </div>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameOverlay">
            <div class="overlay-title">💀 Fallen</div>
            <div class="overlay-score" id="finalScore">Score: 0</div>
            <div class="overlay-buttons">
                <button class="btn-overlay btn-tryagain" id="tryAgainBtn">⚔️ Try Again</button>
                <button class="btn-overlay btn-respawn" id="respawnBtn">🔄 Respawn</button>
            </div>
        </div>

        <!-- IFrame Overlay – external site -->
        <div id="iframeOverlay">
            <div class="iframe-label">✦ sponsored revival ✦</div>
            <iframe id="respawnIframe" src="about:blank" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
            <button class="iframe-close-btn" id="iframeCloseBtn">✕ Close &amp; Continue</button>
        </div>
    </div>

    <script>
        (function() {
            // ─── CONFIG ──────────────────────────────────────────────────────────
            const EXTERNAL_RESPAWN_URL = 'https://gameoverinterstitial.blogspot.com/';

            // ─── Canvas Setup ──────────────────────────────────────────────────
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('gameWrapper');

            function resizeCanvas() {
                const rect = wrapper.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const W = () => canvas.width;
            const H = () => canvas.height;

            // ─── DOM refs ──────────────────────────────────────────────────────
            const livesDisplay = document.getElementById('livesDisplay');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const missDisplay = document.getElementById('missDisplay');
            const gameOverlay = document.getElementById('gameOverlay');
            const finalScore = document.getElementById('finalScore');
            const tryAgainBtn = document.getElementById('tryAgainBtn');
            const respawnBtn = document.getElementById('respawnBtn');
            const iframeOverlay = document.getElementById('iframeOverlay');
            const iframeEl = document.getElementById('respawnIframe');
            const iframeCloseBtn = document.getElementById('iframeCloseBtn');

            // ─── Game State ────────────────────────────────────────────────────
            let lives = 3;
            let score = 0;
            let missCounter = 0;
            const MISS_THRESHOLD = 2;
            let gameActive = true;
            let savedScore = 0;

            let fruits = [];
            let particles = [];
            let slashEffects = [];
            let swordTrail = [];
            let spawnTimer = 0;
            let spawnInterval = 0.9;

            // ─── Utils ──────────────────────────────────────────────────────────
            function random(min, max) { return Math.random() * (max - min) + min; }

            function randomInt(min, max) { return Math.floor(random(min, max + 1)); }

            // ─── Fruit / Bomb Factory ──────────────────────────────────────────
            const fruitEmojis = ['🍎', '🍊', '🍉', '🍇', '🍌', '🍑', '🍒', '🍓', '🥝', '🍋'];
            const bombEmoji = '💣';

            class GameObject {
                constructor(x, y, vx, vy, radius, emoji, isBomb = false) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.radius = radius;
                    this.emoji = emoji;
                    this.isBomb = isBomb;
                    this.sliced = false;
                    this.missed = false;
                    this.rotation = random(0, Math.PI * 2);
                    this.rotSpeed = random(-0.05, 0.05);
                    this.scale = 1;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += 0.12;
                    this.rotation += this.rotSpeed;
                }

                draw(ctx) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);

                    const size = this.radius * 1.9;

                    // ── Bright background glow circle ──
                    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius * 1.6);
                    if (this.isBomb) {
                        grad.addColorStop(0, 'rgba(255, 70, 70, 0.7)');
                        grad.addColorStop(0.5, 'rgba(255, 30, 30, 0.3)');
                        grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
                    } else {
                        grad.addColorStop(0, 'rgba(255, 240, 120, 0.7)');
                        grad.addColorStop(0.5, 'rgba(255, 200, 60, 0.3)');
                        grad.addColorStop(1, 'rgba(255, 200, 50, 0)');
                    }
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 1.6, 0, Math.PI * 2);
                    ctx.fill();

                    // ── Emoji with glow shadow ──
                    ctx.shadowColor = this.isBomb ? 'rgba(255, 60, 60, 0.9)' : 'rgba(255, 235, 150, 0.95)';
                    ctx.shadowBlur = 35;
                    ctx.font = `${size}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    // No fillStyle set – emoji uses its native color
                    ctx.fillText(this.emoji, 0, 0);

                    ctx.restore();
                }

                isOffScreen() {
                    return this.y > H() + this.radius + 30;
                }
            }

            // ─── Particles ──────────────────────────────────────────────────────
            class Particle {
                constructor(x, y, color, count = 18) {
                    this.parts = [];
                    for (let i = 0; i < count; i++) {
                        const angle = random(0, Math.PI * 2);
                        const speed = random(2, 10);
                        this.parts.push({
                            x: x,
                            y: y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed - 2,
                            radius: random(3, 10),
                            color: color,
                            life: 1.0,
                            decay: random(0.01, 0.025),
                        });
                    }
                }

                update() {
                    for (const p of this.parts) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.12;
                        p.life -= p.decay;
                        p.radius *= 0.98;
                    }
                    this.parts = this.parts.filter(p => p.life > 0 && p.radius > 0.5);
                }

                draw(ctx) {
                    for (const p of this.parts) {
                        ctx.globalAlpha = p.life;
                        ctx.fillStyle = p.color;
                        ctx.shadowBlur = 25;
                        ctx.shadowColor = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, Math.max(p.radius, 1), 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                }

                isDead() { return this.parts.length === 0; }
            }

            // ─── Slash Effect ──────────────────────────────────────────────────
            class SlashEffect {
                constructor(x, y, color = '#ffffff') {
                    this.x = x;
                    this.y = y;
                    this.life = 0.6;
                    this.maxLife = 0.6;
                    this.radius = 40;
                    this.color = color;
                }

                update() {
                    this.life -= 0.02;
                    this.radius += 2;
                }

                draw(ctx) {
                    const alpha = this.life / this.maxLife;
                    ctx.save();
                    ctx.globalAlpha = alpha * 0.7;
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                    grad.addColorStop(0, this.color);
                    grad.addColorStop(0.4, this.color + '80');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                isDead() { return this.life <= 0; }
            }

            // ─── Spawning ──────────────────────────────────────────────────────
            function spawnObject() {
                if (!gameActive) return;
                const isBomb = Math.random() < 0.18;
                const emoji = isBomb ? bombEmoji : fruitEmojis[randomInt(0, fruitEmojis.length - 1)];
                const radius = isBomb ? 30 : 26 + random(0, 8);
                const x = random(radius + 30, W() - radius - 30);
                const y = H() - 30 - radius;
                const vx = random(-3.5, 3.5);
                const vy = random(-14, -8);
                const obj = new GameObject(x, y, vx, vy, radius, emoji, isBomb);
                fruits.push(obj);
            }

            // ─── Sword Trail ────────────────────────────────────────────────────
            function addSwordTrail(x, y) {
                swordTrail.push({ x, y, life: 0.7 });
                if (swordTrail.length > 35) swordTrail.shift();
            }

            function updateSwordTrail() {
                for (const t of swordTrail) t.life -= 0.025;
                swordTrail = swordTrail.filter(t => t.life > 0);
            }

            function drawSwordTrail(ctx) {
                if (swordTrail.length < 2) return;
                ctx.save();
                for (let i = 1; i < swordTrail.length; i++) {
                    const p1 = swordTrail[i - 1];
                    const p2 = swordTrail[i];
                    const alpha = p2.life * 0.85;
                    const width = p2.life * 10 + 3;

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.lineWidth = width;
                    ctx.shadowColor = `rgba(255, 220, 170, ${alpha * 0.6})`;
                    ctx.shadowBlur = 30;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = `rgba(255, 255, 220, ${alpha * 0.4})`;
                    ctx.lineWidth = width * 0.25;
                    ctx.shadowBlur = 50;
                    ctx.stroke();
                }
                ctx.restore();
            }

            // ─── Slice Detection ──────────────────────────────────────────────
            function checkSlice(x1, y1, x2, y2) {
                if (!gameActive) return;
                const swipeRadius = 55;

                for (const fruit of fruits) {
                    if (fruit.sliced) continue;
                    const d = distanceToSegment(fruit.x, fruit.y, x1, y1, x2, y2);

                    if (d < fruit.radius + swipeRadius) {
                        fruit.sliced = true;
                        const color = fruit.isBomb ? '#ff4444' : '#ffdd44';
                        slashEffects.push(new SlashEffect(fruit.x, fruit.y, color));

                        if (fruit.isBomb) {
                            lives -= 1;
                            const colors = ['#ff2222', '#ff8800', '#ffcc00', '#ff4444'];
                            for (const c of colors) particles.push(new Particle(fruit.x, fruit.y, c, 14));
                            particles.push(new Particle(fruit.x, fruit.y, '#ff6600', 10));
                            updateHUD();
                            if (lives <= 0) gameOver();
                        } else {
                            score += 1;
                            missCounter = 0;
                            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff9ff3'];
                            particles.push(new Particle(fruit.x, fruit.y, colors[randomInt(0, colors.length - 1)], 12));
                            updateHUD();
                        }
                    }
                }
                fruits = fruits.filter(f => !f.sliced);
            }

            function distanceToSegment(px, py, x1, y1, x2, y2) {
                const dx = x2 - x1,
                    dy = y2 - y1;
                const lenSq = dx * dx + dy * dy;
                if (lenSq === 0) return Math.hypot(px - x1, py - y1);
                let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
                t = Math.max(0, Math.min(1, t));
                const nearX = x1 + t * dx,
                    nearY = y1 + t * dy;
                return Math.hypot(px - nearX, py - nearY);
            }

            // ─── Input ──────────────────────────────────────────────────────────
            let isPointerDown = false;
            let lastX = 0,
                lastY = 0;

            function handleStart(x, y) {
                isPointerDown = true;
                lastX = x;
                lastY = y;
                addSwordTrail(x, y);
            }

            function handleMove(x, y) {
                if (!isPointerDown) return;
                addSwordTrail(x, y);
                checkSlice(lastX, lastY, x, y);
                lastX = x;
                lastY = y;
            }

            function handleEnd() {
                isPointerDown = false;
                swordTrail = [];
            }

            canvas.addEventListener('mousedown', (e) => {
                const rect = canvas.getBoundingClientRect();
                handleStart(e.clientX - rect.left, e.clientY - rect.top);
            });
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                handleMove(e.clientX - rect.left, e.clientY - rect.top);
            });
            canvas.addEventListener('mouseup', handleEnd);
            canvas.addEventListener('mouseleave', handleEnd);

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                handleStart(touch.clientX - rect.left, touch.clientY - rect.top);
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                handleMove(touch.clientX - rect.left, touch.clientY - rect.top);
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                handleEnd();
            }, { passive: false });

            // ─── HUD ────────────────────────────────────────────────────────────
            function updateHUD() {
                let hearts = '';
                for (let i = 0; i < lives; i++) hearts += '❤️';
                if (lives === 0) hearts = '💀';
                livesDisplay.textContent = hearts || '💀';
                scoreDisplay.textContent = `🍉 ${score}`;
                missDisplay.textContent = `Misses: ${missCounter} / ${MISS_THRESHOLD}`;
            }

            // ─── Game Over ─────────────────────────────────────────────────────
            function gameOver() {
                gameActive = false;
                savedScore = score;
                finalScore.textContent = `Score: ${score}`;
                gameOverlay.classList.add('active');
            }

            // ─── Restart (Fresh) ──────────────────────────────────────────────
            function restartFresh() {
                lives = 3;
                score = 0;
                savedScore = 0;
                missCounter = 0;
                gameActive = true;
                fruits = [];
                particles = [];
                slashEffects = [];
                swordTrail = [];
                spawnTimer = 0;
                spawnInterval = 0.9;
                gameOverlay.classList.remove('active');
                iframeOverlay.classList.remove('active');
                iframeCloseBtn.classList.remove('show');
                iframeEl.src = 'about:blank';
                updateHUD();
            }

            // ─── Respawn (restore score) ──────────────────────────────────────
            function respawnWithScore() {
                lives = 3;
                missCounter = 0;
                gameActive = true;
                fruits = [];
                particles = [];
                slashEffects = [];
                swordTrail = [];
                spawnTimer = 0;
                spawnInterval = 0.9;
                gameOverlay.classList.remove('active');
                iframeOverlay.classList.remove('active');
                iframeCloseBtn.classList.remove('show');
                iframeEl.src = 'about:blank';
                updateHUD();
            }

            // ─── IFrame: load external site ───────────────────────────────────
            let respawnReady = false;

            function openRespawnIframe() {
                respawnReady = false;
                iframeCloseBtn.classList.remove('show');
                iframeEl.src = EXTERNAL_RESPAWN_URL;
                iframeOverlay.classList.add('active');

                setTimeout(() => {
                    respawnReady = true;
                    iframeCloseBtn.classList.add('show');
                }, 12000);
            }

            // ─── Button Handlers ──────────────────────────────────────────────
            tryAgainBtn.addEventListener('click', restartFresh);
            respawnBtn.addEventListener('click', openRespawnIframe);

            iframeCloseBtn.addEventListener('click', () => {
                if (respawnReady) {
                    score = savedScore;
                    respawnWithScore();
                }
            });

            // ─── Update Loop ──────────────────────────────────────────────────
            function update() {
                if (!gameActive) return;

                spawnTimer += 1 / 60;
                if (spawnTimer > spawnInterval) {
                    spawnTimer = 0;
                    const count = Math.random() < 0.35 ? 2 : 1;
                    for (let i = 0; i < count; i++) spawnObject();
                    spawnInterval = Math.max(0.45, spawnInterval - 0.0015);
                }

                for (const fruit of fruits) fruit.update();

                for (const fruit of fruits) {
                    if (!fruit.sliced && !fruit.missed && fruit.isOffScreen()) {
                        fruit.missed = true;
                        if (!fruit.isBomb) {
                            missCounter += 1;
                            particles.push(new Particle(fruit.x, H() - 30, '#8888aa', 6));
                            if (missCounter >= MISS_THRESHOLD) {
                                lives -= 1;
                                missCounter = 0;
                                particles.push(new Particle(W() / 2, H() / 2, '#ff3333', 20));
                                if (lives <= 0) gameOver();
                            }
                            updateHUD();
                        }
                    }
                }

                fruits = fruits.filter(f => !f.isOffScreen() && !f.sliced);

                for (const p of particles) p.update();
                particles = particles.filter(p => !p.isDead());

                for (const s of slashEffects) s.update();
                slashEffects = slashEffects.filter(s => !s.isDead());

                updateSwordTrail();
            }

            // ─── Draw Loop ────────────────────────────────────────────────────
            function draw() {
                const w = W(),
                    h = H();
                ctx.clearRect(0, 0, w, h);

                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#0b1426');
                grad.addColorStop(0.5, '#1a1a2e');
                grad.addColorStop(0.8, '#2d1e36');
                grad.addColorStop(1, '#1a0f1a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                ctx.fillStyle = 'rgba(0,0,0,0.20)';
                ctx.fillRect(0, h * 0.85, w, h * 0.15);

                for (const fruit of fruits) fruit.draw(ctx);
                for (const p of particles) p.draw(ctx);
                for (const s of slashEffects) s.draw(ctx);
                drawSwordTrail(ctx);

                if (isPointerDown) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(lastX, lastY, 10, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.fill();
                    ctx.restore();
                }

                if (missCounter > 0 && gameActive) {
                    ctx.save();
                    ctx.font = '1.1rem "Kiwi Maru", sans-serif';
                    ctx.fillStyle = '#ffb6c1';
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 25;
                    ctx.fillText(`⚠️ ${missCounter}/${MISS_THRESHOLD} misses`, 20, H() - 35);
                    ctx.restore();
                }
            }

            // ─── Game Loop ────────────────────────────────────────────────────
            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }

            // ─── Init ──────────────────────────────────────────────────────────
            updateHUD();
            gameLoop();

            window.addEventListener('resize', resizeCanvas);
        })();
    </script>
</body>
</html>
