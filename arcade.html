<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcade · Scroll of Ways</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Kiwi+Maru&display=swap" rel="stylesheet" />
    <style>
       * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

body {
    min-height: 100vh;
    background: #0b0b12;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Cinzel', 'Kiwi Maru', serif;
    overflow: hidden;
}

#gameWrapper {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b0b12;
}

#gameCanvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: none;
}

/* ── HUD ── */
#hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 16px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
    z-index: 50;
    pointer-events: none;
    font-family: 'Cinzel', serif;
    flex-wrap: wrap;
    gap: 8px 16px;
}

#hud>div {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.2rem;
    color: #f5e6c8;
    text-shadow: 0 0 20px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.8);
    letter-spacing: 1px;
}

#hud .label {
    font-size: 0.7rem;
    opacity: 0.6;
    letter-spacing: 3px;
    font-weight: 400;
}

#hud .value {
    font-weight: 900;
    font-size: 1.6rem;
    min-width: 2.4rem;
    text-align: center;
}

#hud .score-value {
    color: #ff66b2;
    text-shadow: 0 0 30px rgba(255, 102, 178, 0.4);
}

#hud .shield-value {
    color: #00d4ff;
    font-size: 1.8rem;
    min-width: 2.8rem;
    text-align: center;
    text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
}

#hud .shield-value.active {
    animation: shieldPulse 0.6s ease-in-out infinite alternate;
}

@keyframes shieldPulse {
    0% {
        transform: scale(1);
        text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
    }
    100% {
        transform: scale(1.15);
        text-shadow: 0 0 60px rgba(0, 212, 255, 0.9), 0 0 100px rgba(0, 212, 255, 0.4);
    }
}

#hud .danger-value {
    color: #ff4444;
    font-size: 0.9rem;
}

/* ── Game Over Overlay ── */
#gameOverlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
    padding: 20px;
}

#gameOverlay.active {
    opacity: 1;
    pointer-events: auto;
}

#gameOverlay .overlay-card {
    background: rgba(30, 10, 30, 0.95);
    border: 2px solid #b300b3;
    border-radius: 40px;
    padding: 40px 50px 35px;
    max-width: 460px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 60px rgba(179, 0, 179, 0.3), 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 0 4px #2d1f14;
    transform: scale(0.9);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

#gameOverlay.active .overlay-card {
    transform: scale(1);
}

#gameOverlay h2 {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 2.2rem;
    color: #ff66b2;
    text-shadow: 0 0 40px rgba(255, 102, 178, 0.3);
    margin-bottom: 4px;
}

#gameOverlay .sub {
    font-family: 'Kiwi Maru', serif;
    font-size: 0.9rem;
    color: #b8a58a;
    margin-bottom: 16px;
    letter-spacing: 2px;
}

#gameOverlay .final-score {
    font-family: 'Cinzel', serif;
    font-size: 2.6rem;
    font-weight: 900;
    color: #ff66b2;
    text-shadow: 0 0 40px rgba(255, 102, 178, 0.3);
    margin: 10px 0 6px;
}

#gameOverlay .final-shield {
    font-family: 'Kiwi Maru', serif;
    font-size: 1rem;
    color: #00d4ff;
    margin-bottom: 20px;
    opacity: 0.7;
}

#gameOverlay .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-top: 8px;
}

#gameOverlay .btn {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 2px;
    padding: 12px 28px;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    color: #faf3e6;
    background: linear-gradient(145deg, #6a006a, #3d003d);
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
    flex: 1 1 auto;
    min-width: 100px;
}

#gameOverlay .btn:hover {
    transform: scale(1.03);
}

#gameOverlay .btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
}

#gameOverlay .btn-primary {
    background: linear-gradient(145deg, #b300b3, #6a006a);
    border-bottom: 3px solid #ff66b2;
}

#gameOverlay .btn-respawn {
    background: linear-gradient(145deg, #00aaff, #0066aa);
    border-bottom: 3px solid #66ddff;
}

#gameOverlay .btn-home {
    background: linear-gradient(145deg, #8b653f, #4d3522);
    border-bottom: 3px solid #c9a87c;
}

/* ── IFrame Overlay ── */
#iframeOverlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    padding: 20px;
}

#iframeOverlay.active {
    opacity: 1;
    pointer-events: auto;
}

#iframeOverlay .iframe-wrapper {
    position: relative;
    width: 100%;
    max-width: 760px;
    height: 0;
    padding-bottom: 140%;
    background: #0b0b12;
    border-radius: 24px;
    overflow: hidden;
    border: 2px solid #b300b3;
    box-shadow: 0 0 80px rgba(179, 0, 179, 0.25);
}

#iframeOverlay .iframe-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: #0b0b12;
}

#iframeOverlay .iframe-close-btn {
    position: relative;
    margin-top: 20px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 2px;
    padding: 14px 40px;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    color: #faf3e6;
    background: linear-gradient(145deg, #00aaff, #0066aa);
    border-bottom: 3px solid #66ddff;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    min-width: 200px;
    white-space: nowrap;
    z-index: 10;
}

#iframeOverlay .iframe-close-btn.show {
    opacity: 1;
    pointer-events: auto;
}

#iframeOverlay .iframe-close-btn:hover {
    transform: scale(1.05);
}

#iframeOverlay .iframe-close-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
}

#iframeOverlay .iframe-label {
    font-family: 'Kiwi Maru', serif;
    color: #b8a58a;
    font-size: 1rem;
    letter-spacing: 3px;
    margin-bottom: 16px;
    text-align: center;
    opacity: 0.6;
}

/* ── Responsive ── */
@media (max-width: 600px) {
    #hud {
        padding: 10px 14px;
        gap: 4px 10px;
    }
    #hud>div {
        font-size: 0.9rem;
    }
    #hud .value {
        font-size: 1.2rem;
        min-width: 1.8rem;
    }
    #hud .shield-value {
        font-size: 1.4rem;
        min-width: 2rem;
    }
    #hud .label {
        font-size: 0.55rem;
    }
    #gameOverlay .overlay-card {
        padding: 28px 20px 24px;
        border-radius: 28px;
    }
    #gameOverlay h2 {
        font-size: 1.6rem;
    }
    #gameOverlay .final-score {
        font-size: 2rem;
    }
    #gameOverlay .btn {
        font-size: 0.75rem;
        padding: 12px 20px;
        min-width: 80px;
    }

    /* ── TALLER IFRAME ON MOBILE ── */
    #iframeOverlay {
        padding: 10px;                /* less outer padding = more room for iframe */
    }
    #iframeOverlay .iframe-wrapper {
        border-radius: 16px;
        max-width: 100%;
        height: 85vh;                 /* ← VERY tall on mobile */
        padding-bottom: 0;            /* disable aspect-ratio trick so height:85vh wins */
    }
    #iframeOverlay .iframe-close-btn {
        font-size: 0.85rem;
        padding: 14px 24px;
        min-width: 160px;
        white-space: normal;
        margin-top: 10px;             /* was 20px – keep button visible */
    }
    #iframeOverlay .iframe-label {
        font-size: 0.9rem;
        margin-bottom: 8px;           /* was 12px */
    }
}

@media (max-width: 400px) {
    #hud {
        padding: 6px 10px;
    }
    #hud>div {
        font-size: 0.7rem;
        gap: 4px;
    }
    #hud .value {
        font-size: 1rem;
        min-width: 1.4rem;
    }
    #hud .shield-value {
        font-size: 1.1rem;
        min-width: 1.6rem;
    }
    #hud .label {
        font-size: 0.45rem;
    }
    #gameOverlay .btn {
        font-size: 0.7rem;
        padding: 10px 16px;
        min-width: 70px;
    }
    #iframeOverlay .iframe-close-btn {
        font-size: 0.75rem;
        padding: 12px 16px;
        min-width: 120px;
    }
    /* slightly shorter so close button never gets cut off on tiny screens */
    #iframeOverlay .iframe-wrapper {
        height: 82vh;
    }
} 
    </style>
</head>
<body>

    <!-- Game Wrapper -->
    <div id="gameWrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div>
            <span class="label">🛡️ SHIELD</span>
            <span class="shield-value" id="shieldDisplay">✕</span>
        </div>
        <div>
            <span class="label">🍉 SCORE</span>
            <span class="value score-value" id="scoreDisplay">0</span>
        </div>
        <div>
            <span class="label">⚡ CHAOS</span>
            <span class="danger-value" id="chaosDisplay">☠️</span>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverlay">
        <div class="overlay-card">
            <h2>💥 Chaos Ends</h2>
            <div class="sub">— The Storm Has Passed —</div>
            <div class="final-score" id="finalScore">0</div>
            <div class="final-shield" id="finalShield">🛡️ 0 shields earned</div>
            <div class="btn-group">
                <button class="btn btn-primary" id="tryAgainBtn">🔄 Try Again</button>
                <button class="btn btn-respawn" id="respawnBtn">♻️ Respawn</button>
                <a href="levels.html" class="btn btn-home">🏮 Dojo</a>
            </div>
        </div>
    </div>

    <!-- IFrame Overlay -->
    <div id="iframeOverlay">
        <div class="iframe-label">⚡ channeling the storm...</div>
        <div class="iframe-wrapper">
            <iframe id="respawnIframe" src="about:blank"></iframe>
        </div>
        <button class="iframe-close-btn" id="iframeCloseBtn">⚡ Close & Continue</button>
    </div>

    <script>
        (function() {
            // ─── CONFIG ──────────────────────────────────────────────────────────
            const EXTERNAL_RESPAWN_URL = 'https://example.com/';

            // ─── Canvas Setup ──────────────────────────────────────────────────
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = document.getElementById('gameWrapper');

            function resizeCanvas() {
                const rect = wrapper.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const W = () => canvas.width;
            const H = () => canvas.height;

            // ─── DOM refs ──────────────────────────────────────────────────────
            const shieldDisplay = document.getElementById('shieldDisplay');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const chaosDisplay = document.getElementById('chaosDisplay');
            const gameOverlay = document.getElementById('gameOverlay');
            const finalScore = document.getElementById('finalScore');
            const finalShield = document.getElementById('finalShield');
            const tryAgainBtn = document.getElementById('tryAgainBtn');
            const respawnBtn = document.getElementById('respawnBtn');
            const iframeOverlay = document.getElementById('iframeOverlay');
            const iframeEl = document.getElementById('respawnIframe');
            const iframeCloseBtn = document.getElementById('iframeCloseBtn');

            // ─── Game State ────────────────────────────────────────────────────
            let score = 0;
            let shieldCount = 0;
            const MAX_SHIELD = 1;
            let gameActive = true;
            let totalShieldsEarned = 0;
            let savedScore = 0;

            let fruits = [];
            let particles = [];
            let slashEffects = [];
            let swordTrail = [];
            let spawnTimer = 0;
            let spawnInterval = 0.55;

            // ─── Utils ──────────────────────────────────────────────────────────
            function random(min, max) { return Math.random() * (max - min) + min; }

            function randomInt(min, max) { return Math.floor(random(min, max + 1)); }

            // ─── Fruit / Bomb Factory ──────────────────────────────────────────
            const fruitEmojis = ['🍎', '🍊', '🍉', '🍇', '🍌', '🍑', '🍒', '🍓', '🥝', '🍋', '🍐', '🍈'];
            const bombEmoji = '💣';

            class GameObject {
                constructor(x, y, vx, vy, radius, emoji, isBomb = false) {
                    this.x = x;
                    this.y = y;
                    this.vx = vx;
                    this.vy = vy;
                    this.radius = radius;
                    this.emoji = emoji;
                    this.isBomb = isBomb;
                    this.sliced = false;
                    this.missed = false;
                    this.rotation = random(0, Math.PI * 2);
                    this.rotSpeed = random(-0.08, 0.08);
                    this.scale = 1;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    // Enhanced gravity for faster fall
                    this.vy += 0.22;
                    this.rotation += this.rotSpeed;
                }

                draw(ctx) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);

                    const size = this.radius * 1.9;

                    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, this.radius * 1.6);
                    if (this.isBomb) {
                        grad.addColorStop(0, 'rgba(255, 70, 70, 0.8)');
                        grad.addColorStop(0.5, 'rgba(255, 30, 30, 0.4)');
                        grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
                    } else {
                        grad.addColorStop(0, 'rgba(255, 240, 120, 0.7)');
                        grad.addColorStop(0.5, 'rgba(255, 200, 60, 0.3)');
                        grad.addColorStop(1, 'rgba(255, 200, 50, 0)');
                    }
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 1.6, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.shadowColor = this.isBomb ? 'rgba(255, 60, 60, 0.9)' : 'rgba(255, 235, 150, 0.95)';
                    ctx.shadowBlur = 35;
                    ctx.font = `${size}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.emoji, 0, 0);

                    ctx.restore();
                }

                isOffScreen() {
                    return this.y > H() + this.radius + 30;
                }
            }

            // ─── Particles ──────────────────────────────────────────────────────
            class Particle {
                constructor(x, y, color, count = 18) {
                    this.parts = [];
                    for (let i = 0; i < count; i++) {
                        const angle = random(0, Math.PI * 2);
                        const speed = random(2, 12);
                        this.parts.push({
                            x: x,
                            y: y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed - 2,
                            radius: random(3, 10),
                            color: color,
                            life: 1.0,
                            decay: random(0.012, 0.03),
                        });
                    }
                }

                update() {
                    for (const p of this.parts) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.12;
                        p.life -= p.decay;
                        p.radius *= 0.98;
                    }
                    this.parts = this.parts.filter(p => p.life > 0 && p.radius > 0.5);
                }

                draw(ctx) {
                    for (const p of this.parts) {
                        ctx.globalAlpha = p.life;
                        ctx.fillStyle = p.color;
                        ctx.shadowBlur = 25;
                        ctx.shadowColor = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, Math.max(p.radius, 1), 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                }

                isDead() { return this.parts.length === 0; }
            }

            class ShieldParticle {
                constructor(x, y) {
                    this.parts = [];
                    const colors = ['#00d4ff', '#00ffaa', '#66ffdd', '#00aaff'];
                    for (let i = 0; i < 30; i++) {
                        const angle = random(0, Math.PI * 2);
                        const speed = random(3, 14);
                        this.parts.push({
                            x: x,
                            y: y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed - 3,
                            radius: random(4, 12),
                            color: colors[randomInt(0, colors.length - 1)],
                            life: 1.0,
                            decay: random(0.008, 0.02),
                        });
                    }
                }

                update() {
                    for (const p of this.parts) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.08;
                        p.life -= p.decay;
                        p.radius *= 0.99;
                    }
                    this.parts = this.parts.filter(p => p.life > 0 && p.radius > 0.5);
                }

                draw(ctx) {
                    for (const p of this.parts) {
                        ctx.globalAlpha = p.life * 0.9;
                        ctx.fillStyle = p.color;
                        ctx.shadowBlur = 35;
                        ctx.shadowColor = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, Math.max(p.radius, 1), 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                }

                isDead() { return this.parts.length === 0; }
            }

            class SlashEffect {
                constructor(x, y, color = '#ff66b2') {
                    this.x = x;
                    this.y = y;
                    this.life = 0.6;
                    this.maxLife = 0.6;
                    this.radius = 40;
                    this.color = color;
                }

                update() {
                    this.life -= 0.02;
                    this.radius += 2.5;
                }

                draw(ctx) {
                    const alpha = this.life / this.maxLife;
                    ctx.save();
                    ctx.globalAlpha = alpha * 0.7;
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                    grad.addColorStop(0, this.color);
                    grad.addColorStop(0.4, this.color + '80');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                isDead() { return this.life <= 0; }
            }

            // ─── Spawning ──────────────────────────────────────────────────────
            function spawnObject() {
                if (!gameActive) return;
                const isBomb = Math.random() < 0.22;
                const emoji = isBomb ? bombEmoji : fruitEmojis[randomInt(0, fruitEmojis.length - 1)];
                const radius = isBomb ? 30 : 24 + random(0, 8);
                const x = random(radius + 30, W() - radius - 30);
                const y = H() - 30 - radius;
                // Enhanced speed for higher arcs
                const vx = random(-6, 6);
                const vy = random(-20, -12);
                const obj = new GameObject(x, y, vx, vy, radius, emoji, isBomb);
                fruits.push(obj);
            }

            // ─── Sword Trail ────────────────────────────────────────────────────
            function addSwordTrail(x, y) {
                swordTrail.push({ x, y, life: 0.7 });
                if (swordTrail.length > 35) swordTrail.shift();
            }

            function updateSwordTrail() {
                for (const t of swordTrail) t.life -= 0.025;
                swordTrail = swordTrail.filter(t => t.life > 0);
            }

            function drawSwordTrail(ctx) {
                if (swordTrail.length < 2) return;
                ctx.save();
                for (let i = 1; i < swordTrail.length; i++) {
                    const p1 = swordTrail[i - 1];
                    const p2 = swordTrail[i];
                    const alpha = p2.life * 0.85;
                    const width = p2.life * 10 + 3;

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = `rgba(255, 150, 255, ${alpha})`;
                    ctx.lineWidth = width;
                    ctx.shadowColor = `rgba(255, 100, 255, ${alpha * 0.6})`;
                    ctx.shadowBlur = 30;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = `rgba(255, 200, 255, ${alpha * 0.4})`;
                    ctx.lineWidth = width * 0.25;
                    ctx.shadowBlur = 50;
                    ctx.stroke();
                }
                ctx.restore();
            }

            // ─── Slice Detection ──────────────────────────────────────────────
            function checkSlice(x1, y1, x2, y2) {
                if (!gameActive) return;
                const swipeRadius = 55;
                let slicedThisSwipe = [];

                for (const fruit of fruits) {
                    if (fruit.sliced) continue;
                    const d = distanceToSegment(fruit.x, fruit.y, x1, y1, x2, y2);

                    if (d < fruit.radius + swipeRadius) {
                        fruit.sliced = true;
                        slicedThisSwipe.push(fruit);

                        const color = fruit.isBomb ? '#ff4444' : '#ff66b2';
                        slashEffects.push(new SlashEffect(fruit.x, fruit.y, color));

                        if (fruit.isBomb) {
                            if (shieldCount > 0) {
                                shieldCount = 0;
                                totalShieldsEarned = Math.max(0, totalShieldsEarned - 1);
                                particles.push(new ShieldParticle(fruit.x, fruit.y));
                                slashEffects.push(new SlashEffect(fruit.x, fruit.y, '#00d4ff'));
                                updateHUD();
                            } else {
                                gameOver();
                                return;
                            }
                        } else {
                            score += 1;
                            const colors = ['#ff66b2', '#ffd93d', '#6bcb77', '#00d4ff', '#ff9ff3'];
                            particles.push(new Particle(fruit.x, fruit.y, colors[randomInt(0, colors.length - 1)], 12));
                            updateHUD();
                        }
                    }
                }

                if (slicedThisSwipe.length >= 2 && shieldCount < MAX_SHIELD) {
                    shieldCount = 1;
                    totalShieldsEarned += 1;
                    for (const f of slicedThisSwipe) {
                        particles.push(new ShieldParticle(f.x, f.y));
                        slashEffects.push(new SlashEffect(f.x, f.y, '#00ffaa'));
                    }
                    updateHUD();
                }

                fruits = fruits.filter(f => !f.sliced);
            }

            function distanceToSegment(px, py, x1, y1, x2, y2) {
                const dx = x2 - x1,
                    dy = y2 - y1;
                const lenSq = dx * dx + dy * dy;
                if (lenSq === 0) return Math.hypot(px - x1, py - y1);
                let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
                t = Math.max(0, Math.min(1, t));
                const nearX = x1 + t * dx,
                    nearY = y1 + t * dy;
                return Math.hypot(px - nearX, py - nearY);
            }

            // ─── Input ──────────────────────────────────────────────────────────
            let isPointerDown = false;
            let lastX = 0,
                lastY = 0;

            function handleStart(x, y) {
                isPointerDown = true;
                lastX = x;
                lastY = y;
                addSwordTrail(x, y);
            }

            function handleMove(x, y) {
                if (!isPointerDown) return;
                addSwordTrail(x, y);
                checkSlice(lastX, lastY, x, y);
                lastX = x;
                lastY = y;
            }

            function handleEnd() {
                isPointerDown = false;
                swordTrail = [];
            }

            canvas.addEventListener('mousedown', (e) => {
                const rect = canvas.getBoundingClientRect();
                handleStart(e.clientX - rect.left, e.clientY - rect.top);
            });
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                handleMove(e.clientX - rect.left, e.clientY - rect.top);
            });
            canvas.addEventListener('mouseup', handleEnd);
            canvas.addEventListener('mouseleave', handleEnd);

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                handleStart(touch.clientX - rect.left, touch.clientY - rect.top);
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                handleMove(touch.clientX - rect.left, touch.clientY - rect.top);
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                handleEnd();
            }, { passive: false });

            // ─── HUD ────────────────────────────────────────────────────────────
            function updateHUD() {
                if (shieldCount > 0) {
                    shieldDisplay.textContent = '🛡️';
                    shieldDisplay.classList.add('active');
                } else {
                    shieldDisplay.textContent = '✕';
                    shieldDisplay.classList.remove('active');
                }
                scoreDisplay.textContent = score;
                chaosDisplay.textContent = shieldCount > 0 ? '🌀' : '☠️';
            }

            // ─── Game Over ─────────────────────────────────────────────────────
            function gameOver() {
                if (!gameActive) return;
                gameActive = false;
                savedScore = score;
                finalScore.textContent = `🍉 ${score}`;
                finalShield.textContent = `🛡️ ${totalShieldsEarned} shield${totalShieldsEarned !== 1 ? 's' : ''} earned`;
                gameOverlay.classList.add('active');
            }

            // ─── Try Again (fresh start, score=0) ─────────────────────────────
            function tryAgain() {
                score = 0;
                shieldCount = 0;
                totalShieldsEarned = 0;
                savedScore = 0;
                gameActive = true;
                fruits = [];
                particles = [];
                slashEffects = [];
                swordTrail = [];
                spawnTimer = 0;
                spawnInterval = 0.55;
                gameOverlay.classList.remove('active');
                iframeOverlay.classList.remove('active');
                iframeCloseBtn.classList.remove('show');
                iframeEl.src = 'about:blank';
                updateHUD();
            }

            // ─── Respawn (restore saved score after iframe) ──────────────────
            let respawnReady = false;

            function openRespawnIframe() {
                respawnReady = false;
                iframeCloseBtn.classList.remove('show');
                iframeEl.src = EXTERNAL_RESPAWN_URL;
                iframeOverlay.classList.add('active');

                // Clear any previous timeout
                if (window._respawnTimeout) {
                    clearTimeout(window._respawnTimeout);
                }

                window._respawnTimeout = setTimeout(() => {
                    respawnReady = true;
                    iframeCloseBtn.classList.add('show');
                    console.log('Respawn ready, button should appear');
                }, 12000);
            }

            function respawnWithScore() {
                if (!respawnReady) return;
                score = savedScore;
                shieldCount = 0;
                totalShieldsEarned = Math.max(0, totalShieldsEarned - 1);
                gameActive = true;
                fruits = [];
                particles = [];
                slashEffects = [];
                swordTrail = [];
                spawnTimer = 0;
                spawnInterval = 0.55;
                gameOverlay.classList.remove('active');
                iframeOverlay.classList.remove('active');
                iframeCloseBtn.classList.remove('show');
                iframeEl.src = 'about:blank';
                updateHUD();
                respawnReady = false;
            }

            // ─── Button Handlers ──────────────────────────────────────────────
            tryAgainBtn.addEventListener('click', tryAgain);
            respawnBtn.addEventListener('click', openRespawnIframe);
            iframeCloseBtn.addEventListener('click', respawnWithScore);

            // ─── Update Loop ──────────────────────────────────────────────────
            function update(delta) {
                if (!gameActive) return;

                spawnTimer += delta;
                if (spawnTimer > spawnInterval) {
                    spawnTimer = 0;
                    const count = Math.random() < 0.4 ? 2 : 1;
                    for (let i = 0; i < count; i++) spawnObject();
                    spawnInterval = Math.max(0.25, spawnInterval - 0.002);
                }

                for (const fruit of fruits) fruit.update();

                for (const fruit of fruits) {
                    if (!fruit.sliced && !fruit.missed && fruit.isOffScreen()) {
                        fruit.missed = true;
                        if (!fruit.isBomb) {
                            if (shieldCount > 0) {
                                shieldCount = 0;
                                totalShieldsEarned = Math.max(0, totalShieldsEarned - 1);
                                particles.push(new ShieldParticle(W() / 2, H() - 60));
                                updateHUD();
                            } else {
                                particles.push(new Particle(fruit.x, H() - 30, '#ff4444', 20));
                                gameOver();
                                return;
                            }
                        }
                    }
                }

                fruits = fruits.filter(f => !f.isOffScreen() && !f.sliced);

                for (const p of particles) p.update();
                particles = particles.filter(p => !p.isDead());

                for (const s of slashEffects) s.update();
                slashEffects = slashEffects.filter(s => !s.isDead());

                updateSwordTrail();
            }

            // ─── Draw Loop ────────────────────────────────────────────────────
            function draw() {
                const w = W(),
                    h = H();
                ctx.clearRect(0, 0, w, h);

                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#0b0b1a');
                grad.addColorStop(0.3, '#1a0a1a');
                grad.addColorStop(0.6, '#2d0a2d');
                grad.addColorStop(0.85, '#1a0a2a');
                grad.addColorStop(1, '#0b0b12');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                ctx.fillStyle = 'rgba(100, 0, 100, 0.12)';
                ctx.fillRect(0, h * 0.85, w, h * 0.15);

                for (const fruit of fruits) fruit.draw(ctx);
                for (const p of particles) p.draw(ctx);
                for (const s of slashEffects) s.draw(ctx);
                drawSwordTrail(ctx);

                if (isPointerDown) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(lastX, lastY, 10, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 150, 255, 0.3)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 150, 255, 0.5)';
                    ctx.fill();
                    ctx.restore();
                }

                if (shieldCount > 0 && gameActive) {
                    ctx.save();
                    ctx.font = '0.9rem "Kiwi Maru", sans-serif';
                    ctx.fillStyle = 'rgba(0, 212, 255, 0.5)';
                    ctx.textAlign = 'center';
                    ctx.fillText('🛡️ SHIELD ACTIVE', w / 2, h - 40);
                    ctx.restore();
                }

                if (gameActive && fruits.length > 12) {
                    ctx.save();
                    ctx.font = '0.8rem "Kiwi Maru", sans-serif';
                    ctx.fillStyle = 'rgba(255, 100, 100, 0.25)';
                    ctx.textAlign = 'center';
                    ctx.fillText('⚡ STORM INTENSIFIES', w / 2, 70);
                    ctx.restore();
                }
            }

            // ─── Game Loop ────────────────────────────────────────────────────
            let lastTime = 0;

            function gameLoop(timestamp) {
                const delta = Math.min((timestamp - lastTime) / 1000, 0.05);
                lastTime = timestamp;

                update(delta);
                draw();
                requestAnimationFrame(gameLoop);
            }

            // ─── Init ──────────────────────────────────────────────────────────
            updateHUD();
            requestAnimationFrame((ts) => {
                lastTime = ts;
                gameLoop(ts);
            });

            window.addEventListener('resize', resizeCanvas);
        })();
    </script>
